apiVersion: apps/v1
kind: Deployment
metadata:
  name: telemetry-collector
  namespace: devops-system
  labels:
    app: telemetry-collector
spec:
  replicas: 1
  selector:
    matchLabels:
      app: telemetry-collector
  template:
    metadata:
      labels:
        app: telemetry-collector
    spec:
      containers:
        - name: collector
          image: app/telemetry-collector:v1.2.0
          env:
            - name: PORT
              value: "8001"
            - name: SENTINEL_CORE_URL
              value: "http://devops-sentinel-service.devops-system.svc.cluster.local"
            - name: WEB_API_URL
              value: "http://web-api.production.svc.cluster.local:8080"
            - name: ORDER_SERVICE_URL
              value: "http://order-service.production.svc.cluster.local:8081"
          ports:
            - containerPort: 8001
          readinessProbe:
            httpGet:
              path: /
              port: 8001
            initialDelaySeconds: 3
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: telemetry-collector-service
  namespace: devops-system
spec:
  type: ClusterIP
  selector:
    app: telemetry-collector
  ports:
    - protocol: TCP
      port: 8001
      targetPort: 8001
