apiVersion: v1
kind: ServiceAccount
metadata:
  name: devops-sentinel-sa
  namespace: devops-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: devops-sentinel-role
rules:
  - apiGroups: ["", "apps", "batch"]
    resources: ["pods", "pods/log", "events", "deployments", "deployments/rollback", "services", "configmaps"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: devops-sentinel-binding
subjects:
  - kind: ServiceAccount
    name: devops-sentinel-sa
    namespace: devops-system
roleRef:
  kind: ClusterRole
  name: devops-sentinel-role
  apiGroup: rbac.authorization.k8s.io
